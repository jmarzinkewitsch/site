services:
  vault-api:
    build: .
    ports:
      - "8787:8000"
    # Values come from .env via Compose interpolation and are passed into the
    # container here (Compose's .env is interpolation-only, not auto-injected).
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      VAULT_CONFIG_PATH: ${VAULT_CONFIG_PATH:-/data/config.json}
      VAULT_DB_PATH: ${VAULT_DB_PATH:-/data/vault.db}
      VAULT_BEARER_TOKEN: ${VAULT_BEARER_TOKEN:-}
      VAULT_KIOSK_TOKEN: ${VAULT_KIOSK_TOKEN:-}
      JELLYFIN_URL: ${JELLYFIN_URL:-}
      JELLYFIN_TOKEN: ${JELLYFIN_TOKEN:-}
      JELLYFIN_USER_ID: ${JELLYFIN_USER_ID:-}
      ROON_API_URL: ${ROON_API_URL:-}
      HOME_ASSISTANT_URL: ${HOME_ASSISTANT_URL:-}
      HOME_ASSISTANT_TOKEN: ${HOME_ASSISTANT_TOKEN:-}
      IMMICH_URL: ${IMMICH_URL:-}
      IMMICH_TOKEN: ${IMMICH_TOKEN:-}
    volumes:
      - vault-config:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
    restart: unless-stopped

  roon-jukebox-api:
    profiles: ["roon"]
    build: ./roon-jukebox-api
    network_mode: host
    environment:
      PORT: ${ROON_JUKEBOX_PORT:-3085}
      ROON_HOST: ${ROON_HOST:-}
      ROON_PORT: ${ROON_CORE_PORT:-9100}
      ROON_STATE_FILE: /data/config.json
    volumes:
      - roon-config:/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - vault-redis:/data

volumes:
  vault-config:
  vault-redis:
  roon-config:
