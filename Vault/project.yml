name: Vault
options:
  bundleIdPrefix: de.marzinkewitsch
  deploymentTarget:
    tvOS: "17.0"
  createIntermediateGroups: true

packages:
  FFmpegKit:
    url: https://github.com/kingslay/FFmpegKit
    from: "6.1.3"

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "3"
    # Set your team once in Xcode (Signing & Capabilities) or put the ID here:
    DEVELOPMENT_TEAM: ""

targets:
  Vault:
    type: application
    platform: tvOS
    sources:
      - Vault
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Vault/Vault.entitlements
    dependencies:
      - target: VaultTopShelf
        embed: true
      # Umbrella product: links all Libav* xcframeworks plus their TLS deps
      # (gnutls/nettle/hogweed/gmp). Linking bare Libav* products would fail
      # with undefined symbols.
      - package: FFmpegKit
        product: FFmpegKit
    preBuildScripts:
      - name: Sanitize FFmpegKit framework bundle ids
        basedOnDependencyAnalysis: false
        script: |
          # Some FFmpegKit/KSPlayer xcframeworks ship a CFBundleIdentifier with an
          # underscore (e.g. ...libshaderc_combined). Underscores are invalid in
          # bundle ids and make framework embedding fail, so rewrite them to
          # hyphens before the frameworks are embedded.
          ROOT="${BUILD_DIR%/Build/*}"
          [ -d "$ROOT" ] || exit 0
          find "$ROOT" -name Info.plist -path "*.framework/*" 2>/dev/null | while read -r plist; do
            id=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$plist" 2>/dev/null) || continue
            case "$id" in
              *_*)
                newid=$(printf '%s' "$id" | tr '_' '-')
                # The xcframework Info.plists ship read-only, so make writable first.
                chmod u+w "$plist" 2>/dev/null || true
                /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $newid" "$plist" \
                  && echo "fixed bundle id: $id -> $newid"
                ;;
            esac
          done
    info:
      path: Vault/Info.plist
      properties:
        CFBundleDisplayName: Vault
        UIUserInterfaceStyle: Dark
        # Self-hosted Jellyfin servers are plain HTTP on the LAN (192.168.x.x)
        # and arbitrary hosts over VPN. Sideloaded private app — no ATS concerns.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: de.marzinkewitsch.Vault
            CFBundleURLSchemes:
              - vault

  VaultTopShelf:
    type: app-extension
    platform: tvOS
    sources:
      - VaultTopShelf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.marzinkewitsch.Vault.TopShelf
        INFOPLIST_FILE: VaultTopShelf/Info.plist
        CODE_SIGN_ENTITLEMENTS: VaultTopShelf/VaultTopShelf.entitlements

  VaultTests:
    type: bundle.unit-test
    platform: tvOS
    sources:
      - VaultTests
    dependencies:
      - target: Vault
      # PacketQueueTests builds real AVPackets, so the test target needs the
      # Libav* modules visible too.
      - package: FFmpegKit
        product: FFmpegKit
